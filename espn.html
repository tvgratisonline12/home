<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canais ESPN - WebApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Área da Lista de Canais (Esquerda) */
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
        }

        .header {
            padding: 20px;
            background-color: #d32f2f;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 10px;
        }

        .channel-item {
            padding: 15px;
            margin-bottom: 8px;
            background-color: #2c2c2c;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            font-size: 1rem;
        }

        /* Estilo para o item focado via D-Pad ou Mouse */
        .channel-item.selected {
            background-color: #d32f2f;
            font-weight: bold;
            transform: scale(1.02);
            outline: none;
        }

        /* Área do Player (Direita) */
        .player-container {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lista Lateral de Canais -->
    <div class="sidebar">
        <div class="header">Canais ESPN</div>
        <ul id="channelList" class="channel-list"></ul>
    </div>

    <!-- Player de Vídeo -->
    <div class="player-container">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>

    <script>
        // Lista de canais fornecida
        const canais = [
            { "canal": "ESPN", "logo": "espn", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 2", "logo": "espn2", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 3", "logo": "espn3", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 4", "logo": "espn4", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 5", "logo": "espn5", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 6", "logo": "espn6", "qualidade": "ec", "categorias": ["Todos", "Esportes"] }
        ];

        let currentIndex = 0;
        const listElement = document.getElementById("channelList");
        const videoPlayer = document.getElementById("videoPlayer");

        // Renderizar a lista de canais na tela
        function renderChannels() {
            listElement.innerHTML = "";
            canais.forEach((c, index) => {
                const li = document.createElement("li");
                li.className = `channel-item ${index === currentIndex ? 'selected' : ''}`;
                li.textContent = c.canal;
                li.onclick = () => {
                    currentIndex = index;
                    updateSelection();
                    playChannel(c);
                };
                listElement.appendChild(li);
            });
        }

        // Tocar o canal selecionado
        function playChannel(c) {
            const urlVideo = "https://redecanaistv.uk/player3/ch.php?canal=" + c.logo;
            videoPlayer.src = urlVideo;
        }

        // Atualizar visualmente qual canal está selecionado
        function updateSelection() {
            const items = listElement.getElementsByClassName("channel-item");
            for (let i = 0; i < items.length; i++) {
                if (i === currentIndex) {
                    items[i].classList.add("selected");
                    items[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    items[i].classList.remove("selected");
                }
            }
        }

        // Controle via Teclado / D-Pad (Android TV / Set-top boxes)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    updateSelection();
                }
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                if (currentIndex < canais.length - 1) {
                    currentIndex++;
                    updateSelection();
                }
            } else if (e.key === "Enter" || e.keyCode === 13) {
                e.preventDefault();
                playChannel(canais[currentIndex]);
            }
        });

        // Inicialização: Renderiza os canais e já inicia o primeiro tocando
        renderChannels();
        playChannel(canais[0]);
    </script>
</body>
</html>
