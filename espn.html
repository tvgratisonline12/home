<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canais ESPN - Opção 1 e Opção 2</title>
    <!-- Importando o CSS e JS do Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

        /* Container do Player preenchendo 100% da tela */
        #player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Estilização para o Video.js ocupar a tela inteira */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            background-color: #000 !important;
        }

        /* Iframe para links com player embutido */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Botões de Navegação Lateral para Mobile / Toque */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            padding: 20px 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            border-radius: 8px;
            transition: background 0.3s;
            outline: none;
        }
        .nav-btn:active { background: rgba(168, 85, 247, 0.7); }
        #btn-prev { left: 10px; }
        #btn-next { right: 10px; }

        /* Footer flutuante de largura total com animação de 5 segundos */
        #footer-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.6));
            color: white;
            padding: 20px 30px;
            font-size: 22px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10000;
            border-top: 4px solid #a855f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #footer-info.show { opacity: 1; }

        .canal-badge {
            background: #a855f7;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Onde o player (Video.js ou Iframe) será injetado via JS -->
        <div id="player"></div>

        <!-- Botões de Seta na Tela para Mobile -->
        <button class="nav-btn" id="btn-prev" onclick="canalAnterior()">&#10094;</button>
        <button class="nav-btn" id="btn-next" onclick="proximoCanal()">&#10095;</button>
        
        <!-- Footer Informativo do Canal -->
        <div id="footer-info">
            <span id="canalNome">Carregando...</span>
            <span class="canal-badge" id="canalVersao">Ao Vivo</span>
        </div>
    </div>

    <script>
        // Lista configurada com Opção 1 (Player) e Opção 2 (Embutido) para cada canal ESPN
        const canaisRaw = [
            { "canal": "ESPN", "logo": "espn", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN", "logo": "espn", "qualidade": "eb", "versao": "Opção 2" },
            { "canal": "ESPN 2", "logo": "espn2", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN 2", "logo": "espn2", "qualidade": "eb", "versao": "Opção 2" },
            { "canal": "ESPN 3", "logo": "espn3", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN 3", "logo": "espn3", "qualidade": "eb", "versao": "Opção 2" },
            { "canal": "ESPN 4", "logo": "espn4", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN 4", "logo": "espn4", "qualidade": "eb", "versao": "Opção 2" },
            { "canal": "ESPN 5", "logo": "espn5", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN 5", "logo": "espn5", "qualidade": "eb", "versao": "Opção 2" },
            { "canal": "ESPN 6", "logo": "espn6", "qualidade": "ec", "versao": "Opção 1" },
            { "canal": "ESPN 6", "logo": "espn6", "qualidade": "eb", "versao": "Opção 2" }
        ];

        let indiceCanalAtivo = 0;
        let playerInstance = null;
        let footerTimeout = null;

        let touchStartX = 0;
        let touchEndX = 0;

        // --- 1. LÓGICA DE REPRODUÇÃO INTELIGENTE ---
        async function playCanal(c) {
            const qual = String(c.qualidade || "").toLowerCase();

            if (playerInstance) {
                playerInstance.dispose();
                playerInstance = null;
            }

            const container = document.getElementById("player");
            container.innerHTML = "";

            if (qual === "eb") {
                // Opção 2: Player embutido via iframe
                const urlVideo = "https://open.tvgratis.workers.dev/?url=https://ww4.embedtv.lat/" + encodeURIComponent(c.logo);
                container.innerHTML = `<iframe src="${urlVideo}" allow="autoplay; fullscreen" style="width:100%;height:100%;border:none;"></iframe>`;
            } else {
                // Opção 1: Player de vídeo dedicado (.m3u8)
                const urlVideo = "https://open.tvgratis.workers.dev/" + encodeURIComponent(c.logo) + "/index.m3u8";
                container.innerHTML = `<video id="video-player" class="video-js vjs-big-play-centered" controls autoplay playsinline style="width:100%;height:100%;"></video>`;
                
                playerInstance = videojs('video-player', {
                    autoplay: true,
                    controls: true,
                    muted: false,
                    sources: [{
                        src: urlVideo,
                        type: 'application/x-mpegURL'
                    }]
                }, function() {
                    this.play().catch(e => console.log("Erro na reprodução automática:", e));
                });
            }

            mostrarFooterCanal(c.canal, c.versao);
        }

        // --- 2. EXIBIÇÃO DO FOOTER (5 SEGUNDOS) ---
        function mostrarFooterCanal(nomeCanal, versaoCanal) {
            const footer = document.getElementById('footer-info');
            const nomeSpan = document.getElementById('canalNome');
            const versaoSpan = document.getElementById('canalVersao');
            if (!footer || !nomeSpan || !versaoSpan) return;

            nomeSpan.innerText = `${nomeCanal} — ${versaoCanal}`;
            versaoSpan.innerText = "Ao Vivo";
            footer.classList.add('show');

            clearTimeout(footerTimeout);
            footerTimeout = setTimeout(() => {
                footer.classList.remove('show');
            }, 5000);
        }

        // --- 3. NAVEGAÇÃO ---
        function proximoCanal() {
            indiceCanalAtivo = (indiceCanalAtivo < canaisRaw.length - 1) ? indiceCanalAtivo + 1 : 0;
            playCanal(canaisRaw[indiceCanalAtivo]);
        }

        function canalAnterior() {
            indiceCanalAtivo = (indiceCanalAtivo > 0) ? indiceCanalAtivo - 1 : canaisRaw.length - 1;
            playCanal(canaisRaw[indiceCanalAtivo]);
        }

        // --- 4. CONTROLE POR D-PAD / SETAS DO TECLADO ---
        window.addEventListener("keydown", (e) => {
            if (canaisRaw.length === 0) return;

            if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
                e.preventDefault();
                canalAnterior();
            } else if (e.key === "ArrowDown" || e.key === "ArrowRight") {
                e.preventDefault();
                proximoCanal();
            }
        });

        // --- 5. SUPORTE A GESTOS DE TOQUE (SWIPE NA TELA) ---
        const containerApp = document.getElementById('player-container');

        containerApp.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        containerApp.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            tratarSwipe();
        }, { passive: true });

        function tratarSwipe() {
            const limiteSwipe = 50;
            if (touchEndX < touchStartX - limiteSwipe) {
                proximoCanal();
            }
            if (touchEndX > touchStartX + limiteSwipe) {
                canalAnterior();
            }
        }

        // --- 6. INICIALIZAÇÃO AUTOMÁTICA NO PRIMEIRO CANAL ---
        window.onload = function() {
            if (canaisRaw.length > 0) {
                indiceCanalAtivo = 0;
                playCanal(canaisRaw[0]);
            }
        };
    </script>
</body>
</html>
