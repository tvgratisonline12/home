<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPlayer TV - Tela Cheia</title>
    <!-- Incluindo a biblioteca Hls.js para reproduzir arquivos .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Player ocupando 100% da tela */
        #videoPlayer {
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000;
            object-fit: contain;
        }

        /* Footer de 100% de largura ou faixa na parte inferior */
        #footerInfo {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.6));
            color: white;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border-top: 4px solid #d32f2f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #footerInfo.show { opacity: 1; }
        
        .canal-badge {
            background: #d32f2f;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Player de Vídeo Nativo -->
    <video id="videoPlayer" autoplay playsinline></video>
    
    <!-- Footer Informativo -->
    <div id="footerInfo">
        <span id="canalNome">Carregando...</span>
        <span class="canal-badge">Ao Vivo</span>
    </div>

    <script>
        // Lista fixa de canais ESPN configurada diretamente no código
        const canais = [
            { "canal": "ESPN", "logo": "espn" },
            { "canal": "ESPN 2", "logo": "espn2" },
            { "canal": "ESPN 3", "logo": "espn3" },
            { "canal": "ESPN 4", "logo": "espn4" },
            { "canal": "ESPN 5", "logo": "espn5" },
            { "canal": "ESPN 6", "logo": "espn6" }
        ];

        let currentIndex = 0;
        let timer = null;
        let hls = null;

        const video = document.getElementById("videoPlayer");
        const footer = document.getElementById("footerInfo");
        const canalNome = document.getElementById("canalNome");

        function playChannel(index) {
            const c = canais[index];
            // Montagem da URL exatamente no formato solicitado
            const urlVideo = "https://open.tvgratis.workers.dev/" + c.logo + "/index.m3u8";

            // Destruir instância anterior do HLS se existir
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(urlVideo);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay bloqueado pelo navegador:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Suporte nativo para plataformas Apple (Safari / iOS)
                video.src = urlVideo;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay bloqueado:", e));
                });
            }

            // Atualiza o texto e exibe o footer
            canalNome.textContent = c.canal;
            footer.classList.add("show");

            // Oculta o footer automaticamente após 5 segundos
            clearTimeout(timer);
            timer = setTimeout(() => {
                footer.classList.remove("show");
            }, 5000);
        }

        // Navegação por D-Pad (Setas Cima/Baixo ou Esquerda/Direita)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
                e.preventDefault();
                currentIndex = (currentIndex > 0) ? currentIndex - 1 : canais.length - 1;
                playChannel(currentIndex);
            } else if (e.key === "ArrowDown" || e.key === "ArrowRight") {
                e.preventDefault();
                currentIndex = (currentIndex < canais.length - 1) ? currentIndex + 1 : 0;
                playChannel(currentIndex);
            }
        });

        // Inicializa abrindo o primeiro canal (ESPN) automaticamente tocando em tela cheia
        window.addEventListener("DOMContentLoaded", () => {
            playChannel(0);
        });
    </script>
</body>
</html>
