<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canais ESPN - WebPlayer TV</title>
    <!-- Importando o CSS e JS do Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

        /* Container do Player preenchendo 100% da tela */
        #player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Estilização para o Video.js ocupar a tela inteira */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            background-color: #000 !important;
        }

        /* Footer flutuante de largura total com animação de 5 segundos */
        #footer-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.6));
            color: white;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10000;
            border-top: 4px solid #a855f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #footer-info.show { opacity: 1; }

        .canal-badge {
            background: #a855f7;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Onde o player será injetado via JS -->
        <div id="player"></div>
        
        <!-- Footer Informativo do Canal -->
        <div id="footer-info">
            <span id="canalNome">Carregando...</span>
            <span class="canal-badge">Ao Vivo</span>
        </div>
    </div>

    <script>
        // Lista fixa de canais configurada diretamente no código (sem JSON)
        const canaisRaw = [
            { "canal": "ESPN", "logo": "espn", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 2", "logo": "espn2", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 3", "logo": "espn3", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 4", "logo": "espn4", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 5", "logo": "espn5", "qualidade": "ec", "categorias": ["Todos", "Esportes"] },
            { "canal": "ESPN 6", "logo": "espn6", "qualidade": "ec", "categorias": ["Todos", "Esportes"] }
        ];

        let indiceCanalAtivo = 0;
        let playerInstance = null;
        let footerTimeout = null;

        // --- 1. LÓGICA DE REPRODUÇÃO COM AUTOPLAY FORÇADO ---
        async function playCanal(c) {
            const qual = String(c.qualidade || "").toLowerCase();

            // Destruir instância anterior do Video.js para evitar conflito de memória
            if (playerInstance) {
                playerInstance.dispose();
                playerInstance = null;
            }

            const container = document.getElementById("player");
            container.innerHTML = "";

            // Formação da URL conforme o padrão solicitado
            let urlVideo = "https://open.tvgratis.workers.dev/" + encodeURIComponent(c.logo) + "/index.m3u8";

            // Renderiza o elemento de vídeo padrão do Video.js com atributos de autoplay e playsinline
            container.innerHTML = `<video id="video-player" class="video-js vjs-big-play-centered" controls autoplay playsinline style="width:100%;height:100%;"></video>`;
            
            playerInstance = videojs('video-player', {
                autoplay: true,
                controls: true,
                muted: false, // Deixe true se o seu navegador bloquear áudio sem interação
                sources: [{
                    src: urlVideo,
                    type: 'application/x-mpegURL'
                }]
            }, function() {
                // Força o play programaticamente assim que o player estiver pronto
                const promise = this.play();
                if (promise !== undefined) {
                    promise.catch(error => {
                        console.log("Autoplay restrito, tentando reproduzir com mudo:", error);
                        this.muted(true);
                        this.play();
                    });
                }
            });

            // Exibe o footer informativo na parte inferior
            mostrarFooterCanal(c.canal);
        }

        // --- 2. EXIBIÇÃO DO FOOTER (5 SEGUNDOS) ---
        function mostrarFooterCanal(nomeCanal) {
            const footer = document.getElementById('footer-info');
            const nomeSpan = document.getElementById('canalNome');
            if (!footer || !nomeSpan) return;

            nomeSpan.innerText = nomeCanal;
            footer.classList.add('show');

            clearTimeout(footerTimeout);
            footerTimeout = setTimeout(() => {
                footer.classList.remove('show');
            }, 5000);
        }

        // --- 3. CONTROLE POR D-PAD / SETAS DO TECLADO ---
        window.addEventListener("keydown", (e) => {
            if (canaisRaw.length === 0) return;

            if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
                e.preventDefault();
                indiceCanalAtivo = (indiceCanalAtivo > 0) ? indiceCanalAtivo - 1 : canaisRaw.length - 1;
                playCanal(canaisRaw[indiceCanalAtivo]);
            } else if (e.key === "ArrowDown" || e.key === "ArrowRight") {
                e.preventDefault();
                indiceCanalAtivo = (indiceCanalAtivo < canaisRaw.length - 1) ? indiceCanalAtivo + 1 : 0;
                playCanal(canaisRaw[indiceCanalAtivo]);
            }
        });

        // --- 4. INICIALIZAÇÃO AUTOMÁTICA NO PRIMEIRO CANAL ---
        window.onload = function() {
            if (canaisRaw.length > 0) {
                indiceCanalAtivo = 0;
                playCanal(canaisRaw[0]);
            }
        };
    </script>
</body>
</html>
